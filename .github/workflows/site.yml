# Monta o curso como site (app instalável, funciona offline) e o publica no GitHub Pages.
# A cada envio (inclusive um merge na main) o site só é montado e conferido, e o pacote fica no run para homologação.
# Ele só é publicado quando alguém roda este workflow à mão na main, marcando "Publicar o site", como o APK:
# integrar (merge) e publicar são passos separados. Procedimento em auditoria/integracao-segura.md.
name: Site

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:
    inputs:
      publicar:
        description: 'Publicar o site no GitHub Pages (só vale na main)'
        type: boolean
        default: false

# O token só lê o repositório. Só o job publicar, que faz o deploy, recebe permissão para o Pages.
permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  montar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Montar o site
        run: python3 web/build.py _site
      - name: Conferir o JavaScript
        run: for f in _site/app.js _site/sw.js _site/dados/*.js; do node --check "$f"; done
      # O build acima já confere o conteúdo (e apaga a saída se falhar). Este passo confere de novo, e também que o
      # build.py e os workflows continuam conferindo. Ele tem de ficar logo antes do envio: se algo falhar, o job
      # para aqui, o pacote não é enviado e o job publicar (needs: montar) não roda.
      - name: Conferir que nada restrito vai para o site
        run: |
          python3 -I web/verificar_publicacao.py autoteste
          python3 -I web/verificar_publicacao.py validar
          python3 -I web/verificar_publicacao.py conferir-workflows
          python3 -I web/verificar_publicacao.py verificar _site --site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publicar:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publicar
    needs: montar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
