# Roda os testes da plataforma (dados do curso e comportamento no navegador) a cada push.
# Só lê o repositório e não publica nada.
name: Testes

on:
  push:
    branches: [main, 'claude/**', 'codex/**']
  workflow_dispatch:
    inputs:
      historico_legado:
        description: 'Executar critérios históricos do transporte desativado (incompatibilidade conhecida)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plataforma:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # O Playwright fica fora da pasta do repositório, com versão fixa, para não entrar no build nem na verificação.
      - name: Instalar o Playwright e o Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-audit --no-fund playwright@1.63.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Testes da plataforma
        run: |
          node testes/operacoes.test.js
          node testes/legado-contrato.test.js
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node testes/legado-bloqueio.test.js
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node testes/ciclo-sincronia.test.js
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node testes/plataforma.test.js

  # Contas, transações, regras do Firestore e exclusão de conta nos emuladores oficiais do Firebase (projeto de teste
  # "demo-eear": nenhum serviço real e nenhuma credencial). Roda em paralelo com o job acima.
  firebase-emulador:
    runs-on: ubuntu-latest
    # O emulators:exec encerra os emuladores no fim, também quando os testes falham; o limite cobre um travamento.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # Versões fixas, fora da pasta do repositório. O firebase-tools baixa o emulador do Firestore (um .jar) a cada execução.
      - name: Instalar o firebase-tools, o SDK web do Firebase e o Playwright
        run: |
          npm install --prefix "$RUNNER_TEMP/fb" --no-save --no-audit --no-fund firebase-tools@15.35.0 firebase@12.19.0 playwright@1.63.0
          "$RUNNER_TEMP/fb/node_modules/.bin/playwright" install --with-deps chromium
      - name: Testes nos emuladores
        run: |
          NODE_PATH="$RUNNER_TEMP/fb/node_modules" EEAR_FIREBASE_SDK="$RUNNER_TEMP/fb/node_modules/firebase" \
            EEAR_FIREBASE_CLI="$RUNNER_TEMP/fb/node_modules/.bin/firebase" node testes/firebase-emulador.test.js
          NODE_PATH="$RUNNER_TEMP/fb/node_modules" EEAR_FIREBASE_SDK="$RUNNER_TEMP/fb/node_modules/firebase" \
            EEAR_FIREBASE_CLI="$RUNNER_TEMP/fb/node_modules/.bin/firebase" node testes/persistencia-regressoes.test.js
          NODE_PATH="$RUNNER_TEMP/fb/node_modules" EEAR_FIREBASE_SDK="$RUNNER_TEMP/fb/node_modules/firebase" \
            EEAR_FIREBASE_CLI="$RUNNER_TEMP/fb/node_modules/.bin/firebase" node testes/operacoes-dupla-falha.test.js
          NODE_PATH="$RUNNER_TEMP/fb/node_modules" EEAR_FIREBASE_SDK="$RUNNER_TEMP/fb/node_modules/firebase" \
            node testes/cache-restaurado.test.js
          NODE_PATH="$RUNNER_TEMP/fb/node_modules" EEAR_FIREBASE_SDK="$RUNNER_TEMP/fb/node_modules/firebase" \
            EEAR_FIREBASE_CLI="$RUNNER_TEMP/fb/node_modules/.bin/firebase" node testes/sincronia-firebase.test.js

  # Evidência histórica opcional, com saída original: não mascara a falha nem integra o gate Firebase.
  historico-legado:
    if: github.event_name == 'workflow_dispatch' && inputs.historico_legado
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar o navegador histórico
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-audit --no-fund playwright@1.63.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Critérios históricos sem alterar asserções
        shell: bash
        run: |
          set -o pipefail
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node testes/historicos-legado.test.js 2>&1 | tee historico-legado.log
