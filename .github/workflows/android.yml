# Gera o app de Android (APK) com o Capacitor a partir do mesmo site.
# A cada envio o APK só é compilado (e, com a chave fixa, assinado e conferido). Ele só vai para a página de
# downloads (Releases) quando alguém roda este workflow à mão na main, marcando "Publicar o APK".
# O versionCode é o número desta execução: não renomeie este workflow, senão a contagem recomeça
# e o Android recusa a versão nova por ser "mais antiga".
name: App Android

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:
    inputs:
      publicar:
        description: 'Publicar o APK na página de downloads (só vale na main, com a chave fixa)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Conteúdo do app
        run: python3 web/build.py app/www --app
      - name: Projeto Android
        working-directory: app
        run: |
          npm ci
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android
      - name: Versão do app
        working-directory: app/android/app
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" build.gradle
          grep -n "versionCode\|versionName" build.gradle
      # Com a chave fixa (segredos ANDROID_*, ver app/ASSINATURA.md) sai o APK de distribuição, que instala por
      # cima da versão anterior sem perder o progresso. Sem ela, sai um APK de teste (debug), que nunca é publicado.
      - name: Compilar o APK
        working-directory: app/android
        env:
          CHAVE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          CHAVE_SENHA: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CHAVE_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CHAVE_SENHA_ALIAS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$CHAVE_BASE64" ]; then
            # tira quebras de linha e espaços que venham na colagem (por exemplo, do Windows)
            printf '%s' "$CHAVE_BASE64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/inphax.jks"
            ./gradlew assembleRelease --no-daemon --stacktrace \
              -Pandroid.injected.signing.store.file="$RUNNER_TEMP/inphax.jks" \
              -Pandroid.injected.signing.store.password="$CHAVE_SENHA" \
              -Pandroid.injected.signing.key.alias="$CHAVE_ALIAS" \
              -Pandroid.injected.signing.key.password="$CHAVE_SENHA_ALIAS"
            rm -f "$RUNNER_TEMP/inphax.jks"
            cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/missao-eear.apk"
            echo "ASSINADO=1" >> "$GITHUB_ENV"
          else
            echo "::notice::Sem a chave fixa do app: APK de teste (debug), que não é publicado."
            ./gradlew assembleDebug --no-daemon --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/missao-eear.apk"
            echo "ASSINADO=0" >> "$GITHUB_ENV"
          fi
          ls -la "$GITHUB_WORKSPACE/missao-eear.apk"
      # A impressão digital esperada fica na variável ANDROID_CERT_SHA256 (não é segredo): se o APK vier com
      # outra chave, para aqui, porque essa versão não instalaria por cima da anterior.
      - name: Conferir a assinatura
        if: env.ASSINADO == '1'
        env:
          ESPERADO: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs missao-eear.apk | tee certificado.txt
          SHA=$(grep -m1 'SHA-256 digest' certificado.txt | awk '{print $NF}' | tr 'A-F' 'a-f')
          ESP=$(echo "$ESPERADO" | tr -d ': ' | tr 'A-F' 'a-f')
          echo "SHA-256 do certificado: $SHA"
          if [ -z "$ESP" ]; then echo "::warning::Variável ANDROID_CERT_SHA256 não definida: a chave não foi comparada."
          elif [ "$ESP" != "$SHA" ]; then echo "::error::O APK foi assinado com outra chave ($SHA, esperado $ESP)"; exit 1; fi
      # Só fica para baixar o APK com a chave fixa, feito na main e publicado à mão.
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publicar && env.ASSINADO == '1'
        with:
          name: missao-eear-apk
          path: missao-eear.apk
      - name: Publicar na página de downloads
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publicar && env.ASSINADO == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-1.0.${{ github.run_number }}"
          gh release create "$TAG" missao-eear.apk --target "${{ github.sha }}" --latest \
            --title "App Android 1.0.${{ github.run_number }}" \
            --notes "Baixe o arquivo missao-eear.apk no celular Android e abra-o para instalar (o Android pede para permitir a instalação deste app). O progresso fica salvo no aparelho."
