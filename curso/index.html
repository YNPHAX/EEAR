<title>Missão EEAR</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Saira+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: app de estudo mobile-first — cabeçalho tipo painel de voo, conteúdo em coluna única (máx. 760px), barra de abas fixa embaixo no celular e no topo em telas largas. */
:root {
  --bg: #F3F1EC;
  --surface: #FFFFFF;
  --surface-2: #F7F5F0;
  --ink: #0C0C0C;
  --muted: #5F5B54;
  --line: #DEDAD1;
  --accent: #C8102E;
  --accent-soft: #FBE4E7;
  --on-accent: #FFFFFF;
  /* topo com a marca INPHAX: preto nos dois temas */
  --top-bg: #0C0C0C; --top-ink: #EFEAE0; --top-muted: #A39E94; --top-accent: #FF4D5A; --top-line: #262421;
  --ok: #19744A;
  --ok-soft: #DDF2E6;
  --bad: #A8201A;
  --bad-soft: #FBE4E1;
  --warn: #9A5B00;
  --warn-soft: #FBEFD6;
  --por: #2F55C9;
  --ing: #7A3FC4;
  --mat: #0E766F;
  --fis: #8C5F00;
  --display: "Saira Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Barlow", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 10px;
  --nav-h: 62px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C0C0C; --surface: #151515; --surface-2: #1D1D1D; --ink: #EFEAE0; --muted: #A39E94; --line: #2B2926;
    --accent: #FF4D5A; --accent-soft: #3A1418; --on-accent: #160304;
    --ok: #46C98A; --ok-soft: #12301F; --bad: #FF7466; --bad-soft: #3A1714; --warn: #F0B54A; --warn-soft: #33270F;
    --por: #8AA8FF; --ing: #B79BFF; --mat: #4FD0C4; --fis: #E9BC52;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C0C0C; --surface: #151515; --surface-2: #1D1D1D; --ink: #EFEAE0; --muted: #A39E94; --line: #2B2926;
  --accent: #FF4D5A; --accent-soft: #3A1418; --on-accent: #160304;
  --ok: #46C98A; --ok-soft: #12301F; --bad: #FF7466; --bad-soft: #3A1714; --warn: #F0B54A; --warn-soft: #33270F;
  --por: #8AA8FF; --ing: #B79BFF; --mat: #4FD0C4; --fis: #E9BC52;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--top-bg); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--top-bg); color: var(--top-ink); border-bottom: 1px solid var(--top-line); }
.top-in { max-width: 760px; margin: 0 auto; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; align-items: center; gap: 12px; }
.brand { display: flex; flex-direction: column; gap: 6px; line-height: 1; }
.brand small { font-family: var(--display); font-weight: 700; font-size: .95rem; letter-spacing: .08em; text-transform: uppercase; color: var(--top-muted); }
.brand-x { width: 30px; height: 30px; flex: none; border-radius: 6px; }
/* logotipo INPHAX: a imagem vira máscara e pega a cor do texto */
.marca { display: inline-block; height: .78em; aspect-ratio: 440 / 65; background: currentColor; -webkit-mask: url(marca/inphax.png) center / contain no-repeat; mask: url(marca/inphax.png) center / contain no-repeat; vertical-align: -.04em; }
.brand .marca { color: var(--top-ink); height: 17px; }
.tminus { margin-left: auto; text-align: right; font-family: var(--mono); font-size: .78rem; color: var(--top-muted); line-height: 1.25; white-space: nowrap; }
.tminus b { display: block; font-size: 1.15rem; color: var(--top-accent); letter-spacing: .02em; }

.wrap { max-width: 760px; margin: 0 auto; padding-block: 18px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 16px; }

nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tabs-in { max-width: 760px; margin: 0 auto; display: grid; grid-template-columns: repeat(6, 1fr); height: var(--nav-h); }
.tab { background: none; border: 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: .74rem; font-weight: 600; color: var(--muted); letter-spacing: .02em; }
.tab svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tab[aria-current="page"] { color: var(--accent); }
@media (min-width: 820px) {
  nav.tabs { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 61px); bottom: auto; border-top: 0; border-bottom: 1px solid var(--line); }
  .tabs-in { height: 48px; }
  .tab { flex-direction: row; font-size: .88rem; gap: 8px; }
  .tab svg { width: 18px; height: 18px; }
  .wrap { padding-bottom: 48px; }
}

h1, h2, h3 { text-wrap: balance; }
.h1 { font-family: var(--display); font-weight: 700; font-size: 1.9rem; line-height: 1.05; letter-spacing: .01em; margin: 0; }
.h2 { font-family: var(--display); font-weight: 700; font-size: 1.35rem; line-height: 1.1; letter-spacing: .015em; margin: 0; }
.eyebrow { font-size: .72rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: .88rem; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card.plain { background: transparent; border: 0; padding: 0; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 42px; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; cursor: pointer; text-decoration: none; color: var(--ink); }
.btn:hover { border-color: var(--muted); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.pri:hover { filter: brightness(1.06); }
.btn.sm { min-height: 34px; padding: 4px 12px; font-size: .88rem; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--accent); padding-inline: 6px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.back { align-self: flex-start; }

.chip { display: inline-flex; align-items: center; gap: 5px; font-size: .74rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.chip.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.chip.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.chip.acc { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.sigla { font-family: var(--mono); font-weight: 600; font-size: .78rem; letter-spacing: .04em; }
.c-por { color: var(--por); } .c-ing { color: var(--ing); } .c-mat { color: var(--mat); } .c-fis { color: var(--fis); }
.b-por { --sc: var(--por); } .b-ing { --sc: var(--ing); } .b-mat { --sc: var(--mat); } .b-fis { --sc: var(--fis); }

.meter { height: 8px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--sc, var(--accent)); border-radius: 99px; }
.subj { display: grid; grid-template-columns: 42px 1fr auto; gap: 4px 12px; align-items: center; }
.subj .meter { grid-column: 2 / 4; }

.tasks { display: flex; flex-direction: column; }
.task { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.task:first-child { border-top: 0; }
.task .tt { min-width: 0; }
.task .tt b { font-weight: 600; }
.task.done .tt { color: var(--muted); }
.task.done .tt b { text-decoration: line-through; text-decoration-thickness: 1px; }
.check { width: 26px; height: 26px; border-radius: 7px; border: 2px solid var(--line); background: var(--surface); display: grid; place-items: center; cursor: pointer; padding: 0; }
.check svg { width: 16px; height: 16px; stroke: var(--on-accent); fill: none; stroke-width: 3; opacity: 0; }
.check.on { background: var(--ok); border-color: var(--ok); }
.check.on svg { opacity: 1; stroke: var(--surface); }
.check.auto { cursor: default; }

.banner { border-radius: var(--r); padding: 12px 14px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.banner.warn { background: var(--warn-soft); color: var(--ink); border: 1px solid transparent; }
.banner.acc { background: var(--accent-soft); }
.banner p { margin: 0; flex: 1 1 240px; }

.mods { display: flex; flex-direction: column; }
.modrow { display: grid; grid-template-columns: 58px 1fr auto; gap: 10px; align-items: center; padding: 11px 4px; border-top: 1px solid var(--line); background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; cursor: pointer; width: 100%; }
.modrow:first-child { border-top: 0; }
.modrow:hover .mt { color: var(--accent); }
.mt { font-weight: 600; line-height: 1.3; }
.peso { font-family: var(--mono); font-size: .72rem; color: var(--muted); letter-spacing: .1em; }

.seg { display: flex; gap: 4px; padding: 4px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; overflow-x: auto; }
.seg button { flex: 1 0 auto; border: 0; background: none; padding: 8px 12px; border-radius: 7px; font-weight: 600; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }

.teoria { line-height: 1.62; }
.teoria > * { margin: 0; }
.teoria { display: flex; flex-direction: column; gap: 12px; }
.teoria h3 { font-family: var(--display); font-size: 1.3rem; font-weight: 700; letter-spacing: .01em; margin-top: 8px; line-height: 1.15; }
.teoria h4 { font-size: 1rem; font-weight: 700; margin-top: 4px; }
.teoria ul, .teoria ol { padding-left: 1.3em; display: flex; flex-direction: column; gap: 4px; }
.teoria .f { background: var(--surface-2); border: 1px solid var(--line); border-left: 4px solid var(--sc, var(--accent)); border-radius: 8px; padding: 10px 12px; font-family: var(--mono); font-size: .92rem; line-height: 1.7; overflow-x: auto; white-space: pre-wrap; }
.teoria .dica { background: var(--accent-soft); border-radius: 8px; padding: 10px 12px; }
.teoria .dica::before { content: "Na prova: "; font-weight: 700; color: var(--accent); }
.tbl { overflow-x: auto; }
.tbl table { border-collapse: collapse; width: 100%; font-size: .92rem; }
.tbl th, .tbl td { border: 1px solid var(--line); padding: 6px 9px; text-align: left; vertical-align: top; }
.tbl th { background: var(--surface-2); font-weight: 700; }
.teoria em { font-style: italic; }
sup, sub { line-height: 0; }

.q-enun { font-size: 1.04rem; line-height: 1.55; }
.q-enun p { margin: 0 0 8px; }
.q-enun .txt { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: .95rem; margin-bottom: 10px; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start; text-align: left; padding: 11px 12px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; line-height: 1.45; }
.opt:hover:not([disabled]) { border-color: var(--accent); }
.opt .l { font-family: var(--mono); font-weight: 600; width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center; background: var(--surface-2); border: 1px solid var(--line); font-size: .85rem; }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.sel .l { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.right .l { background: var(--ok); color: var(--surface); border-color: var(--ok); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .l { background: var(--bad); color: var(--surface); border-color: var(--bad); }
.opt[disabled] { cursor: default; }
.expl { border-radius: 9px; padding: 12px 14px; background: var(--surface-2); border: 1px solid var(--line); }
.expl b.ok { color: var(--ok); } .expl b.bad { color: var(--bad); }
.qimg { display: block; max-width: 100%; width: auto; height: auto; background: #fff; border-radius: 6px; padding: 4px; cursor: zoom-in; }
.qimg.zoom { max-width: none; width: 180%; cursor: zoom-out; }
.q-enun:has(.qimg) { overflow-x: auto; }
.txtimg:has(.zoom) { overflow-x: auto; }
.txtimg { padding: 6px; background: #fff; display: flex; flex-direction: column; gap: 8px; max-height: 60vh; overflow-y: auto; }
.txtimg .qimg { padding: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.opts.letras { display: grid; grid-template-columns: repeat(4, 1fr); }
.opts.letras .opt { grid-template-columns: 1fr; justify-items: center; padding: 10px 6px; }
.opts.letras .opt .l { width: 34px; height: 34px; font-size: 1rem; }
.src { font-size: .72rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin-bottom: 8px; }
.vlink { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); color: var(--ink); font-weight: 600; text-decoration: none; }
.vlink::before { content: ""; flex: none; width: 0; height: 0; border-left: 11px solid var(--accent); border-top: 7px solid transparent; border-bottom: 7px solid transparent; }
.vlink:hover { border-color: var(--accent); }

.score { font-family: var(--display); font-weight: 700; font-size: 3.2rem; line-height: 1; }
.score small { font-size: 1.1rem; color: var(--muted); font-family: var(--body); font-weight: 500; }

.fc { min-height: 220px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); padding: 22px 18px; display: flex; flex-direction: column; gap: 14px; justify-content: center; text-align: center; font-size: 1.12rem; line-height: 1.5; }
.fc .verso { border-top: 1px dashed var(--line); padding-top: 14px; color: var(--ink); }
.fc .tag { align-self: center; }

.simbar { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 61px); z-index: 5; background: var(--bg); padding-block: 8px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
@media (min-width: 820px) { .simbar { top: calc(env(safe-area-inset-top, 0px) + 110px); } }
.timer { font-family: var(--mono); font-weight: 600; font-size: 1.1rem; }
.timer.low { color: var(--bad); }
.qmap { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 6px; }
.qmap button { height: 38px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); font-family: var(--mono); font-size: .8rem; cursor: pointer; }
.qmap button.ans { background: var(--surface-2); border-color: var(--muted); }
.qmap button.mk { border-color: var(--warn); box-shadow: inset 0 -3px 0 var(--warn); }
.qmap button.cur { outline: 2px solid var(--accent); }

.days { display: flex; flex-direction: column; gap: 10px; }
.day { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; grid-template-columns: 64px 1fr; gap: 12px; }
.day.today { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.day.past { opacity: .72; }
.day .dd { font-family: var(--mono); font-size: .82rem; color: var(--muted); line-height: 1.3; }
.day .dd b { display: block; font-size: 1.05rem; color: var(--ink); }
.day ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; font-size: .94rem; min-width: 0; }
.day li.done { color: var(--muted); text-decoration: line-through; }
.week { font-family: var(--display); font-weight: 700; font-size: 1.05rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-top: 6px; }

.form { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field label, .field .lab { font-size: .8rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.field input, .field select { min-height: 42px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 6px 10px; width: 100%; }
.field input:disabled { opacity: .55; cursor: not-allowed; }
/* Aula: player do YouTube, lista de vídeos e navegação entre aulas */
.video { gap: 10px; }
.player { position: relative; aspect-ratio: 16 / 9; border-radius: 8px; overflow: hidden; background: #000; }
.player iframe, .pl-capa { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.pl-capa { padding: 0; cursor: pointer; background: #000; display: block; }
.pl-capa img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: .9; }
.pl-btn { position: absolute; left: 50%; top: 50%; width: 68px; height: 68px; margin: -34px 0 0 -34px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; box-shadow: 0 4px 18px rgba(0,0,0,.35); }
.pl-btn svg { width: 30px; height: 30px; fill: var(--on-accent); margin-left: 4px; }
.pl-capa:hover .pl-btn { filter: brightness(1.08); }
.cred { margin: 0; }
.vlist { display: flex; flex-direction: column; }
.vrow { display: grid; grid-template-columns: 84px 1fr 20px; gap: 10px; align-items: center; padding: 10px 4px; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; cursor: pointer; color: var(--ink); text-decoration: none; width: 100%; }
.vrow.on .vb b, .vrow:hover .vb b { color: var(--accent); }
.vrow .vt { font-size: .7rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.vrow .vb { display: flex; flex-direction: column; min-width: 0; }
.vrow .vb b { font-weight: 600; }
.vrow .vext { color: var(--muted); text-align: center; }
.navaula { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.navaula .btn { white-space: normal; text-align: left; }
/* Trilha de aulas da matéria */
.trilha { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.trow { display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; align-items: center; width: 100%; padding: 10px 2px; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; cursor: pointer; color: var(--ink); }
.trilha li:first-child .trow { border-top: 0; }
.trow .tn { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-family: var(--mono); font-weight: 600; font-size: .85rem; border: 2px solid var(--line); color: var(--muted); background: var(--surface); }
.trow .tn svg { width: 16px; height: 16px; fill: none; stroke: var(--surface); stroke-width: 3; }
.trow.ok .tn { background: var(--ok); border-color: var(--ok); }
.trow.cur .tn { border-color: var(--sc, var(--accent)); color: var(--sc, var(--accent)); }
.trow .tb { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.trow:hover .mt { color: var(--accent); }
.tprog { display: block; height: 4px; border-radius: 99px; background: var(--surface-2); overflow: hidden; max-width: 220px; }
.tprog > i { display: block; height: 100%; background: var(--sc, var(--accent)); }
.cont { border-left: 4px solid var(--sc, var(--accent)); }
/* Certificado */
.cert { background: #fff; color: #0C0C0C; border: 2px solid #0C0C0C; border-radius: 6px; padding: 10px; }
.cert-in { border: 1px solid #C8102E; border-radius: 3px; padding: 28px 22px; display: flex; flex-direction: column; gap: 12px; text-align: center; align-items: center; }
